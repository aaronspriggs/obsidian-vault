<rect x="133" y="172" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320.0" y="190.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Patch panel (only if wall runs end here)</text>
<rect x="133" y="202" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320.0" y="220.0" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USW Pro Max 16 PoE  ·  ~5 lb</text>
<rect x="133" y="232" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320.0" y="250.0" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">UDM Pro  ·  8.6 lb</text>
<rect x="133" y="262" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320.0" y="280.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Spare / cable manager</text>
<rect x="133" y="292" width="374" height="56" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320.0" y="317.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">2U vented shelf  ·  ~5–10 lb loaded</text>
<text x="320.0" y="333.0" font-size="11" fill="#334155" text-anchor="middle">HDHomeRun Flex 4K · USW Flex 2.5G 8 PoE (Basement)?</text>
<rect x="133" y="352" width="374" height="416" rx="4" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="320.0" y="557.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">14U open for growth</text>
<text x="320.0" y="573.0" font-size="11" fill="#334155" text-anchor="middle">heavy additions go at the bottom of this zone</text>
<rect x="133" y="772" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320.0" y="790.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Vented blank (airflow, cable slack)</text>
<rect x="133" y="802" width="374" height="206" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="320.0" y="902.0" font-size="13" font-weight="700" fill="#3b0764" text-anchor="middle">Big Boi · JMCD 12S4 · 7U</text>
<text x="320.0" y="918.0" font-size="11" fill="#3b0764" text-anchor="middle">36–38 lb with 4 HDDs · 48–50 lb with 12 · on rails/shelf</text>
<rect x="133" y="1012" width="374" height="56" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="1037.0" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">UniFi UPS 2U  ·  30.9 lb</text>
<text x="320.0" y="1053.0" font-size="11" fill="#78350f" text-anchor="middle">on rear support rails</text>
<line x1="544" y1="121" x2="562" y2="108" stroke="#a16207" stroke-width="1.2"/>
<circle cx="544" cy="121" r="3" fill="#a16207"/>
<text x="570" y="108" font-size="13" font-weight="700" fill="#a16207">Radios outside the metal</text>
<text x="570" y="126" font-size="12" fill="#334155">A steel rack shields 2.4 GHz and Z-Wave. Keep the</text>
<text x="570" y="142" font-size="12" fill="#334155">hubs and USB sticks on top or beside it (the ZWA-2</text>
<text x="570" y="158" font-size="12" fill="#334155">plan already says &quot;outside the metal rack&quot;).</text>
<line x1="544" y1="245.0" x2="562" y2="200" stroke="#2563eb" stroke-width="1.2"/>
<circle cx="544" cy="245.0" r="3" fill="#2563eb"/>
<text x="570" y="200" font-size="13" font-weight="700" fill="#2563eb">Network core at the top</text>
<text x="570" y="218" font-size="12" fill="#334155">Light, and at eye level for patching and LEDs.</text>
<text x="570" y="234" font-size="12" fill="#334155">UDM Pro and switch next to each other: short SFP+</text>
<text x="570" y="250" font-size="12" fill="#334155">link between them, UPS and hubs patch into the UDM.</text>
<text x="570" y="266" font-size="12" fill="#334155">Big Boi&#x27;s 10 GbE DAC now runs ~23U (≈ 40&quot;):</text>
<text x="570" y="282" font-size="12" fill="#334155">plan on a 2 m DAC; check the current one&#x27;s length.</text>
<line x1="544" y1="320.0" x2="562" y2="334" stroke="#475569" stroke-width="1.2"/>
<circle cx="544" cy="320.0" r="3" fill="#475569"/>
<text x="570" y="334" font-size="13" font-weight="700" fill="#475569">Small boxes on a shelf</text>
<text x="570" y="352" font-size="12" fill="#334155">Whatever lives in the rack today besides the four</text>
<text x="570" y="368" font-size="12" fill="#334155">main units. Not recorded in the KB: confirm.</text>
<line x1="544" y1="560.0" x2="562" y2="524" stroke="#475569" stroke-width="1.2"/>
<circle cx="544" cy="560.0" r="3" fill="#475569"/>
<text x="570" y="524" font-size="13" font-weight="700" fill="#475569">Growth zone (U11–U24)</text>
<text x="570" y="542" font-size="12" fill="#334155">Room for a GPU box, second server or JBOD later.</text>
<text x="570" y="558" font-size="12" fill="#334155">Fill it bottom-up so weight stays low; light gear</text>
<text x="570" y="574" font-size="12" fill="#334155">can go just under the shelf.</text>
<line x1="544" y1="905.0" x2="562" y2="794" stroke="#7c3aed" stroke-width="1.2"/>
<circle cx="544" cy="905.0" r="3" fill="#7c3aed"/>
<text x="570" y="794" font-size="13" font-weight="700" fill="#7c3aed">Big Boi just above the UPS</text>
<text x="570" y="812" font-size="12" fill="#334155">Second-heaviest now, heaviest once the bays fill.</text>
<text x="570" y="828" font-size="12" fill="#334155">Measured 272 mm tall, so it needs 7U; ~12&quot; deep.</text>
<text x="570" y="844" font-size="12" fill="#334155">Support it from below (L-rails or a 1U shelf, which</text>
<text x="570" y="860" font-size="12" fill="#334155">shifts it to U4–U10). Rack ears alone aren&#x27;t meant</text>
<text x="570" y="876" font-size="12" fill="#334155">to carry ~50 lb cantilevered off the front posts.</text>
<line x1="544" y1="1040.0" x2="562" y2="949" stroke="#d97706" stroke-width="1.2"/>
<circle cx="544" cy="1040.0" r="3" fill="#d97706"/>
<text x="570" y="949" font-size="13" font-weight="700" fill="#d97706">UPS at the very bottom</text>
<text x="570" y="967" font-size="12" fill="#334155">Densest item (14 kg in 2U). Lowest centre of gravity,</text>
<text x="570" y="983" font-size="12" fill="#334155">and the convention for battery units. Short power</text>
<text x="570" y="999" font-size="12" fill="#334155">runs up to Big Boi. Check whether it shipped with</text>
<text x="570" y="1015" font-size="12" fill="#334155">rails; if not, add rear supports.</text>
<rect x="30" y="1130" width="920" height="140" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="50" y="1156" font-size="14" font-weight="700" fill="#0f172a">Weight (estimates, 2026-11-02)</text>
<text x="420" y="1156" font-size="12" font-weight="700" fill="#475569">4 HDDs</text>
<text x="540" y="1156" font-size="12" font-weight="700" fill="#475569">12 HDDs</text>
<text x="50" y="1178" font-size="12" font-weight="400" fill="#0f172a">UPS 2U (U1–U2)</text>
<text x="420" y="1178" font-size="12" font-weight="400" fill="#0f172a">30.9 lb</text>
<text x="540" y="1178" font-size="12" font-weight="400" fill="#0f172a">30.9 lb</text>
<text x="50" y="1196" font-size="12" font-weight="400" fill="#0f172a">Big Boi in 12S4 (U3–U9)</text>
<text x="420" y="1196" font-size="12" font-weight="400" fill="#0f172a">36–38 lb</text>
<text x="540" y="1196" font-size="12" font-weight="400" fill="#0f172a">48–50 lb</text>
<text x="50" y="1214" font-size="12" font-weight="400" fill="#0f172a">UDM Pro + Pro Max 16 (U28–U29)</text>
<text x="420" y="1214" font-size="12" font-weight="400" fill="#0f172a">~13.6 lb</text>
<text x="540" y="1214" font-size="12" font-weight="400" fill="#0f172a">~13.6 lb</text>
<text x="50" y="1232" font-size="12" font-weight="400" fill="#0f172a">Shelf, small boxes, PDU, cables</text>
<text x="420" y="1232" font-size="12" font-weight="400" fill="#0f172a">5–15 lb</text>
<text x="540" y="1232" font-size="12" font-weight="400" fill="#0f172a">5–15 lb</text>
<text x="50" y="1250" font-size="12" font-weight="700" fill="#0f172a">Total</text>
<text x="420" y="1250" font-size="12" font-weight="700" fill="#0f172a">~86–98 lb</text>
<text x="540" y="1250" font-size="12" font-weight="700" fill="#0f172a">~98–110 lb</text>
<text x="660" y="1178" font-size="12" fill="#334155">About 80% of the weight sits in</text>
<text x="660" y="1194" font-size="12" fill="#334155">the bottom 9U. Rated 500 lb, so</text>
<text x="660" y="1210" font-size="12" fill="#334155">under a quarter used. Lock the</text>
<text x="660" y="1226" font-size="12" fill="#334155">casters once it's in place.</text>
</svg>
