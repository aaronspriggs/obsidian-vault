<text x="120" y="219" font-size="11" fill="#cbd5e1" text-anchor="end">29</text><line x1="130" y1="200" x2="510" y2="200" stroke="#e2e8f0"/>
<text x="120" y="189" font-size="11" fill="#cbd5e1" text-anchor="end">30</text><line x1="130" y1="170" x2="510" y2="170" stroke="#e2e8f0"/>
