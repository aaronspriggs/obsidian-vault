<line x1="130" y1="530" x2="510" y2="530" stroke="#e2e8f0"/>
<text x="120" y="519" font-size="11" fill="#cbd5e1" text-anchor="end">19</text>
<line x1="130" y1="500" x2="510" y2="500" stroke="#e2e8f0"/>
<text x="120" y="489" font-size="11" fill="#cbd5e1" text-anchor="end">20</text>
<line x1="130" y1="470" x2="510" y2="470" stroke="#e2e8f0"/>
<text x="120" y="459" font-size="11" fill="#cbd5e1" text-anchor="end">21</text>
<line x1="130" y1="440" x2="510" y2="440" stroke="#e2e8f0"/>
<text x="120" y="429" font-size="11" fill="#cbd5e1" text-anchor="end">22</text>
<line x1="130" y1="410" x2="510" y2="410" stroke="#e2e8f0"/>
<text x="120" y="399" font-size="11" fill="#cbd5e1" text-anchor="end">23</text>
