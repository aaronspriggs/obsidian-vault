<rect x="133" y="172" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="190" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Patch panel A  ·  wall runs → switch</text>
<rect x="133" y="202" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="220" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Brush plate</text>
<rect x="133" y="232" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="250" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USW Pro Max 16 PoE  ·  ~5 lb</text>
<rect x="133" y="262" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="280" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">UDM Pro  ·  8.6 lb</text>
<rect x="133" y="292" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="310" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Brush plate</text>
<rect x="133" y="322" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="340" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Patch panel B  ·  purpose to confirm</text>
<rect x="133" y="352" width="374" height="56" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="377" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">UniFi 1U shelf (U23) + 1U headroom</text>
<text x="320" y="393" font-size="11" fill="#334155" text-anchor="middle">HDHomeRun Flex 4K · USW Flex 2.5G 8 PoE?</text>
<rect x="133" y="412" width="374" height="56" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="437" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">UniFi 1U shelf (U21) + 1U headroom</text>
<text x="320" y="453" font-size="11" fill="#334155" text-anchor="middle">ONT(s)? current ISP + Ting, if they move in</text>
<rect x="133" y="472" width="374" height="56" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="497" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Power Distribution Pro  ·  2U  ·  8.2 lb</text>
<text x="320" y="513" font-size="11" fill="#14532d" text-anchor="middle">16 switched + metered outlets · fed from the UPS</text>
<rect x="133" y="532" width="374" height="266" rx="4" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="662" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">9U open for growth</text>
<text x="320" y="678" font-size="11" fill="#334155" text-anchor="middle">heavy additions go at the bottom of this zone</text>
<rect x="133" y="802" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="820" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">1U open or blank plate (airflow above Big Boi)</text>
<rect x="133" y="832" width="374" height="176" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="320" y="917" font-size="13" font-weight="700" fill="#3b0764" text-anchor="middle">Big Boi · JMCD 12S4 · 6U</text>
<text x="320" y="933" font-size="11" fill="#3b0764" text-anchor="middle">36–38 lb with 4 HDDs · 48–50 lb with 12 · on rails/shelf</text>
<rect x="133" y="1012" width="374" height="56" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320" y="1037" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">UniFi UPS 2U  ·  30.9 lb</text>
<text x="320" y="1053" font-size="11" fill="#78350f" text-anchor="middle">on rear support rails · battery outlets: Big Boi + PDU</text>
<line x1="544" y1="121" x2="562" y2="108" stroke="#a16207" stroke-width="1.2"/><circle cx="544" cy="121" r="3" fill="#a16207"/>
<text x="570" y="108" font-size="13" font-weight="700" fill="#a16207">Radios outside the metal</text>
<text x="570" y="126" font-size="12" fill="#334155">A steel rack shields 2.4 GHz and Z-Wave. Keep the</text>
<text x="570" y="142" font-size="12" fill="#334155">hubs and USB sticks on top or beside it (the ZWA-2</text>
<text x="570" y="158" font-size="12" fill="#334155">plan already says &quot;outside the metal rack&quot;).</text>
<line x1="544" y1="245" x2="562" y2="196" stroke="#2563eb" stroke-width="1.2"/><circle cx="544" cy="245" r="3" fill="#2563eb"/>
<text x="570" y="196" font-size="13" font-weight="700" fill="#2563eb">Network core at the top</text>
<text x="570" y="214" font-size="12" fill="#334155">Patch panel A above the switch, brush plate between</text>
<text x="570" y="230" font-size="12" fill="#334155">for 6&quot; patches. UDM Pro stays right under the switch:</text>
<text x="570" y="246" font-size="12" fill="#334155">short SFP+ link. Panel B + brush under the UDM Pro</text>
<text x="570" y="262" font-size="12" fill="#334155">(what it terminates is still to confirm).</text>
<text x="570" y="278" font-size="12" fill="#334155">Big Boi&#x27;s 10 GbE DAC runs ~20U (≈ 35&quot;): plan on a</text>
<text x="570" y="294" font-size="12" fill="#334155">2 m DAC; check the current one&#x27;s length.</text>
<line x1="544" y1="395" x2="562" y2="320" stroke="#475569" stroke-width="1.2"/><circle cx="544" cy="395" r="3" fill="#475569"/>
<text x="570" y="320" font-size="13" font-weight="700" fill="#475569">Two small-box shelves</text>
<text x="570" y="338" font-size="12" fill="#334155">Assumed UACC-Rack-Shelf-CLV: 1U, 250 mm deep,</text>
<text x="570" y="354" font-size="12" fill="#334155">44 lb max. Small boxes only, not for Big Boi (too</text>
<text x="570" y="370" font-size="12" fill="#334155">shallow, and 48–50 lb loaded). Each needs ~1U clear</text>
<text x="570" y="386" font-size="12" fill="#334155">above it for what sits on it. Contents: confirm.</text>
<line x1="544" y1="500" x2="562" y2="420" stroke="#16a34a" stroke-width="1.2"/><circle cx="544" cy="500" r="3" fill="#16a34a"/>
<text x="570" y="420" font-size="13" font-weight="700" fill="#16a34a">PDU Pro under the shelves</text>
<text x="570" y="438" font-size="12" fill="#334155">2U, 106 mm deep. Plugs into a UPS battery outlet and</text>
<text x="570" y="454" font-size="12" fill="#334155">powers the network gear, shelf boxes and ONT(s), all</text>
<text x="570" y="470" font-size="12" fill="#334155">within short cord reach. Big Boi plugs into the UPS</text>
<text x="570" y="486" font-size="12" fill="#334155">directly: outlet state after power loss is unconfirmed</text>
<text x="570" y="502" font-size="12" fill="#334155">and a PDU outlet can be switched off remotely.</text>
<text x="570" y="518" font-size="12" fill="#334155">Store page lists a 0U vertical mount (unverified);</text>
<text x="570" y="534" font-size="12" fill="#334155">that would return 2U to the growth zone.</text>
<line x1="544" y1="665" x2="562" y2="560" stroke="#475569" stroke-width="1.2"/><circle cx="544" cy="665" r="3" fill="#475569"/>
<text x="570" y="560" font-size="13" font-weight="700" fill="#475569">Growth zone (U10–U18)</text>
<text x="570" y="578" font-size="12" fill="#334155">Room for a GPU box, second server or JBOD later.</text>
<text x="570" y="594" font-size="12" fill="#334155">Fill it bottom-up so weight stays low.</text>
<line x1="544" y1="920" x2="562" y2="794" stroke="#7c3aed" stroke-width="1.2"/><circle cx="544" cy="920" r="3" fill="#7c3aed"/>
<text x="570" y="794" font-size="13" font-weight="700" fill="#7c3aed">Big Boi just above the UPS</text>
<text x="570" y="812" font-size="12" fill="#334155">Second-heaviest now, heaviest once the bays fill.</text>
<text x="570" y="828" font-size="12" fill="#334155">Planned as 6U (listing 262 mm; measure, no feet).</text>
<text x="570" y="844" font-size="12" fill="#334155">Keep U9 open or blanked for airflow above it.</text>
<text x="570" y="860" font-size="12" fill="#334155">Support it from below (L-rails or a rated 1U shelf,</text>
<text x="570" y="876" font-size="12" fill="#334155">which shifts it to U4–U9, gap U10, growth U11–U18).</text>
<text x="570" y="892" font-size="12" fill="#334155">Ears alone aren&#x27;t meant to carry ~50 lb</text>
<text x="570" y="908" font-size="12" fill="#334155">cantilevered off the front posts.</text>
<line x1="544" y1="1040" x2="562" y2="949" stroke="#d97706" stroke-width="1.2"/><circle cx="544" cy="1040" r="3" fill="#d97706"/>
<text x="570" y="949" font-size="13" font-weight="700" fill="#d97706">UPS at the very bottom</text>
<text x="570" y="967" font-size="12" fill="#334155">Densest item (14 kg in 2U). Lowest centre of gravity,</text>
<text x="570" y="983" font-size="12" fill="#334155">and the convention for battery units. Only two</text>
<text x="570" y="999" font-size="12" fill="#334155">battery outlets used: Big Boi and the PDU Pro.</text>
<text x="570" y="1015" font-size="12" fill="#334155">Check whether it shipped with rails; if not, add</text>
<text x="570" y="1031" font-size="12" fill="#334155">rear supports.</text>
<rect x="30" y="1130" width="920" height="180" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="50" y="1156" font-size="14" font-weight="700" fill="#0f172a">Weight (estimates, 2026-11-11)</text>
<text x="420" y="1156" font-size="12" font-weight="700" fill="#475569">4 HDDs</text><text x="540" y="1156" font-size="12" font-weight="700" fill="#475569">12 HDDs</text>
<text x="50" y="1178" font-size="12" font-weight="400" fill="#0f172a">UPS 2U (U1–U2)</text>
<text x="420" y="1178" font-size="12" font-weight="400" fill="#0f172a">30.9 lb</text>
<text x="540" y="1178" font-size="12" font-weight="400" fill="#0f172a">30.9 lb</text>
<text x="50" y="1196" font-size="12" font-weight="400" fill="#0f172a">Big Boi in 12S4 (U3–U8)</text>
<text x="420" y="1196" font-size="12" font-weight="400" fill="#0f172a">36–38 lb</text>
<text x="540" y="1196" font-size="12" font-weight="400" fill="#0f172a">48–50 lb</text>
<text x="50" y="1214" font-size="12" font-weight="400" fill="#0f172a">UDM Pro + Pro Max 16 (U27–U28)</text>
<text x="420" y="1214" font-size="12" font-weight="400" fill="#0f172a">~13.6 lb</text>
<text x="540" y="1214" font-size="12" font-weight="400" fill="#0f172a">~13.6 lb</text>
<text x="50" y="1232" font-size="12" font-weight="400" fill="#0f172a">PDU Pro 8.2 · 2 shelves 11.0 · 2 brush plates 1.9</text>
<text x="420" y="1232" font-size="12" font-weight="400" fill="#0f172a">~21 lb</text>
<text x="540" y="1232" font-size="12" font-weight="400" fill="#0f172a">~21 lb</text>
<text x="50" y="1250" font-size="12" font-weight="400" fill="#0f172a">2 patch panels, small boxes, cables (guess)</text>
<text x="420" y="1250" font-size="12" font-weight="400" fill="#0f172a">4–11 lb</text>
<text x="540" y="1250" font-size="12" font-weight="400" fill="#0f172a">4–11 lb</text>
<text x="50" y="1268" font-size="12" font-weight="700" fill="#0f172a">Total</text>
<text x="420" y="1268" font-size="12" font-weight="700" fill="#0f172a">~106–115 lb</text>
<text x="540" y="1268" font-size="12" font-weight="700" fill="#0f172a">~118–127 lb</text>
<text x="680" y="1178" font-size="12" fill="#334155">About 60–65% of the weight sits in</text>
<text x="680" y="1194" font-size="12" fill="#334155">the bottom 8U. Rated 500 lb, so</text>
<text x="680" y="1210" font-size="12" fill="#334155">about a quarter used. Lock the</text>
<text x="680" y="1226" font-size="12" fill="#334155">casters once it&#x27;s in place.</text>
<text x="680" y="1242" font-size="12" fill="#334155">PDU, shelf and brush weights from</text>
<text x="680" y="1258" font-size="12" fill="#334155">techspecs.ui.com; patch panels guessed.</text>
</svg>
