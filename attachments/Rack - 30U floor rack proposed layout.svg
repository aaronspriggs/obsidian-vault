<text x="320" y="190" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Patch panel A (existing)  ·  wall runs</text>
<rect x="133" y="202" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="220" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Brush plate</text>
<rect x="133" y="232" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="250" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USW Pro Max 16 PoE  ·  ~5 lb</text>
<rect x="133" y="262" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="280" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USW Aggregation  ·  8× SFP+  ·  6.0 lb</text>
<rect x="133" y="292" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="310" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">UDM Pro  ·  8.6 lb</text>
<rect x="133" y="322" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="340" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Brush plate</text>
<rect x="133" y="352" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="370" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Patch panel B  ·  more wall runs (likely)</text>
<rect x="133" y="382" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="400" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USW Flex 2.5G 8 PoE in its 1U keystone mount</text>
<rect x="133" y="412" width="374" height="56" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="437" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">CLV shelf 1 (U21) + 1U headroom</text>
<text x="320" y="453" font-size="11" fill="#334155" text-anchor="middle">Hue Bridge · Lutron hub · HDHomeRun · Zigbee dongle</text>
<rect x="133" y="472" width="374" height="56" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="497" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">CLV shelf 2 (U19) + 1U headroom</text>
<text x="320" y="513" font-size="11" fill="#334155" text-anchor="middle">ONTs: CenturyLink + Ting</text>
<rect x="133" y="532" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="550" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Brush plate  ·  cords down to the PDU</text>
<rect x="133" y="562" width="374" height="56" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="587" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Power Distribution Pro  ·  2U  ·  8.2 lb</text>
<text x="320" y="603" font-size="11" fill="#14532d" text-anchor="middle">replaces the Tripp Lite Isobar · fed from the UPS</text>
<rect x="133" y="622" width="374" height="176" rx="4" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="707" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">6U open for growth</text>
<text x="320" y="723" font-size="11" fill="#334155" text-anchor="middle">heavy additions go at the bottom of this zone</text>
<rect x="133" y="802" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="820" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">1U open or blank plate (airflow above Big Boi)</text>
<rect x="133" y="832" width="374" height="176" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="320" y="917" font-size="13" font-weight="700" fill="#3b0764" text-anchor="middle">Big Boi · JMCD 12S4 · 6U</text>
<text x="320" y="933" font-size="11" fill="#3b0764" text-anchor="middle">36–38 lb with 4 HDDs · 48–50 lb with 12 · on rails/shelf</text>
<rect x="133" y="1012" width="374" height="56" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320" y="1037" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">UniFi UPS 2U  ·  30.9 lb</text>
<text x="320" y="1053" font-size="11" fill="#78350f" text-anchor="middle">on rear support rails · battery outlets: Big Boi + PDU</text>
<line x1="544" y1="121" x2="562" y2="100" stroke="#a16207" stroke-width="1.2"/><circle cx="544" cy="121" r="3" fill="#a16207"/>
<text x="570" y="100" font-size="13" font-weight="700" fill="#a16207">USB radios</text>
<text x="570" y="118" font-size="12" fill="#334155">ZWA-2 is too big for a shelf: top of the rack or</text>
<text x="570" y="134" font-size="12" fill="#334155">wall-mounted beside it. Both sticks hang off Big Boi</text>
<text x="570" y="150" font-size="12" fill="#334155">(U3–U8) on USB 2.0 extensions: Zigbee up to shelf 1,</text>
<text x="570" y="166" font-size="12" fill="#334155">ZWA-2 up to the top. Re-map both in the HA VM.</text>
<line x1="544" y1="275" x2="562" y2="214" stroke="#2563eb" stroke-width="1.2"/><circle cx="544" cy="275" r="3" fill="#2563eb"/>
<text x="570" y="214" font-size="13" font-weight="700" fill="#2563eb">Network core at the top</text>
<text x="570" y="232" font-size="12" fill="#334155">Patch panel A (existing wall runs) over the switch,</text>
<text x="570" y="248" font-size="12" fill="#334155">brush plate between for short patches. Aggregation</text>
<text x="570" y="264" font-size="12" fill="#334155">between Pro Max 16 and UDM Pro, short SFP+ DACs to</text>
<text x="570" y="280" font-size="12" fill="#334155">both; Big Boi&#x27;s 10 GbE likely moves to it too (3 of</text>
<text x="570" y="296" font-size="12" fill="#334155">8 SFP+ used). That DAC runs ~19U (≈ 33&quot;): use 2 m.</text>
<text x="570" y="312" font-size="12" fill="#334155">Panel B + brush under the UDM Pro (likely wall runs).</text>
<line x1="544" y1="425" x2="562" y2="340" stroke="#475569" stroke-width="1.2"/><circle cx="544" cy="425" r="3" fill="#475569"/>
<text x="570" y="340" font-size="13" font-weight="700" fill="#475569">Flex mount and two CLV shelves</text>
<text x="570" y="358" font-size="12" fill="#334155">USW Flex 2.5G stays in its own 1U keystone mount.</text>
<text x="570" y="374" font-size="12" fill="#334155">Shelf 1: Hue, Lutron, HDHomeRun, Zigbee dongle (no</text>
<text x="570" y="390" font-size="12" fill="#334155">trouble inside the rack so far). Shelf 2: both ONTs.</text>
<text x="570" y="406" font-size="12" fill="#334155">CLV: 250 mm deep, 44 lb max, small boxes only;</text>
<text x="570" y="422" font-size="12" fill="#334155">each needs ~1U clear above it.</text>
<line x1="544" y1="565" x2="562" y2="452" stroke="#16a34a" stroke-width="1.2"/><circle cx="544" cy="565" r="3" fill="#16a34a"/>
<text x="570" y="452" font-size="13" font-weight="700" fill="#16a34a">Brush plate over the PDU Pro</text>
<text x="570" y="470" font-size="12" fill="#334155">Cords drop through the brush to the PDU, out of</text>
<text x="570" y="486" font-size="12" fill="#334155">sight. Outlet side (front or rear) is unconfirmed;</text>
<text x="570" y="502" font-size="12" fill="#334155">the brush helps most if they face front. Replaces</text>
<text x="570" y="518" font-size="12" fill="#334155">the Isobar. Fed from a UPS battery outlet, powers</text>
<text x="570" y="534" font-size="12" fill="#334155">everything except Big Boi, which stays on the UPS</text>
<text x="570" y="550" font-size="12" fill="#334155">directly. A 0U vertical mount is listed (unverified).</text>
<line x1="544" y1="712" x2="562" y2="600" stroke="#475569" stroke-width="1.2"/><circle cx="544" cy="712" r="3" fill="#475569"/>
<text x="570" y="600" font-size="13" font-weight="700" fill="#475569">Growth zone (U10–U15)</text>
<text x="570" y="618" font-size="12" fill="#334155">6U for a GPU box, second server or JBOD later.</text>
<text x="570" y="634" font-size="12" fill="#334155">Fill it bottom-up so weight stays low.</text>
<line x1="544" y1="920" x2="562" y2="794" stroke="#7c3aed" stroke-width="1.2"/><circle cx="544" cy="920" r="3" fill="#7c3aed"/>
<text x="570" y="794" font-size="13" font-weight="700" fill="#7c3aed">Big Boi just above the UPS</text>
<text x="570" y="812" font-size="12" fill="#334155">Second-heaviest now, heaviest once the bays fill.</text>
<text x="570" y="828" font-size="12" fill="#334155">Planned as 6U (listing 262 mm; measure, no feet).</text>
<text x="570" y="844" font-size="12" fill="#334155">Keep U9 open or blanked for airflow above it.</text>
<text x="570" y="860" font-size="12" fill="#334155">Support it from below (L-rails or a rated 1U shelf,</text>
<text x="570" y="876" font-size="12" fill="#334155">which shifts it to U4–U9, gap U10, growth U11–U15).</text>
<text x="570" y="892" font-size="12" fill="#334155">Ears alone aren&#x27;t meant to carry ~50 lb</text>
<text x="570" y="908" font-size="12" fill="#334155">cantilevered off the front posts.</text>
<line x1="544" y1="1040" x2="562" y2="949" stroke="#d97706" stroke-width="1.2"/><circle cx="544" cy="1040" r="3" fill="#d97706"/>
<text x="570" y="949" font-size="13" font-weight="700" fill="#d97706">UPS at the very bottom</text>
<text x="570" y="967" font-size="12" fill="#334155">Densest item (14 kg in 2U). Lowest centre of gravity,</text>
<text x="570" y="983" font-size="12" fill="#334155">and the convention for battery units. Only two</text>
<text x="570" y="999" font-size="12" fill="#334155">battery outlets used: Big Boi and the PDU Pro.</text>
<text x="570" y="1015" font-size="12" fill="#334155">Check whether it shipped with rails; if not, add</text>
<text x="570" y="1031" font-size="12" fill="#334155">rear supports.</text>
<rect x="30" y="1130" width="920" height="180" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="50" y="1156" font-size="14" font-weight="700" fill="#0f172a">Weight (estimates, 2026-11-12)</text>
<text x="420" y="1156" font-size="12" font-weight="700" fill="#475569">4 HDDs</text><text x="540" y="1156" font-size="12" font-weight="700" fill="#475569">12 HDDs</text>
<text x="50" y="1178" font-size="12" font-weight="400" fill="#0f172a">UPS 2U (U1–U2)</text>
<text x="420" y="1178" font-size="12" font-weight="400" fill="#0f172a">30.9 lb</text>
<text x="540" y="1178" font-size="12" font-weight="400" fill="#0f172a">30.9 lb</text>
<text x="50" y="1196" font-size="12" font-weight="400" fill="#0f172a">Big Boi in 12S4 (U3–U8)</text>
<text x="420" y="1196" font-size="12" font-weight="400" fill="#0f172a">36–38 lb</text>
<text x="540" y="1196" font-size="12" font-weight="400" fill="#0f172a">48–50 lb</text>
<text x="50" y="1214" font-size="12" font-weight="400" fill="#0f172a">UDM Pro + Pro Max 16 + Aggregation (U26–U28)</text>
<text x="420" y="1214" font-size="12" font-weight="400" fill="#0f172a">~19.6 lb</text>
<text x="540" y="1214" font-size="12" font-weight="400" fill="#0f172a">~19.6 lb</text>
<text x="50" y="1232" font-size="12" font-weight="400" fill="#0f172a">PDU Pro 8.2 · 2 shelves 11.0 · 3 brush plates 2.7</text>
<text x="420" y="1232" font-size="12" font-weight="400" fill="#0f172a">~22 lb</text>
<text x="540" y="1232" font-size="12" font-weight="400" fill="#0f172a">~22 lb</text>
<text x="50" y="1250" font-size="12" font-weight="400" fill="#0f172a">Patch panels, Flex mount, small boxes, cables (guess)</text>
<text x="420" y="1250" font-size="12" font-weight="400" fill="#0f172a">6–13 lb</text>
<text x="540" y="1250" font-size="12" font-weight="400" fill="#0f172a">6–13 lb</text>
<text x="50" y="1268" font-size="12" font-weight="700" fill="#0f172a">Total</text>
<text x="420" y="1268" font-size="12" font-weight="700" fill="#0f172a">~115–124 lb</text>
<text x="540" y="1268" font-size="12" font-weight="700" fill="#0f172a">~127–136 lb</text>
<text x="680" y="1178" font-size="12" fill="#334155">About 55–60% of the weight sits in</text>
<text x="680" y="1194" font-size="12" fill="#334155">the bottom 8U. Rated 500 lb, so</text>
<text x="680" y="1210" font-size="12" fill="#334155">about a quarter used. Lock the</text>
<text x="680" y="1226" font-size="12" fill="#334155">casters once it&#x27;s in place.</text>
<text x="680" y="1242" font-size="12" fill="#334155">Agg, PDU, shelf, brush weights from</text>
<text x="680" y="1258" font-size="12" fill="#334155">UI specs; patch panels guessed.</text>
</svg>
