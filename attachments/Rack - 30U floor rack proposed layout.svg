<rect width="980" height="1330" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">30U floor rack — proposed layout</text>
<text x="30" y="62" font-size="13" fill="#475569">Front elevation, U1 at the bottom · rebuilt Big Boi in the JMCD 12S4 · 2026-11-12 draft v6</text>
<text x="30" y="80" font-size="12" fill="#475569">v6: Big Boi raised to U10–U15 for hot-swap access, growth zone below it, ONT on shelf 1 · dashed = not bought, installed or confirmed</text>
