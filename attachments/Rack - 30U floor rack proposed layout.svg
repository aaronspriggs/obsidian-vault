<rect x="133" y="172" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="190" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Patch panel A (existing)  ·  wall runs</text>
<rect x="133" y="202" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="220" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USW Pro Max 16 PoE  ·  ~5 lb</text>
<rect x="133" y="232" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="250" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Patch panel B  ·  more wall runs (likely)</text>
<rect x="133" y="262" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="280" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">UDM Pro  ·  8.6 lb</text>
<rect x="133" y="292" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="310" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USW Aggregation  ·  8× SFP+  ·  6.0 lb</text>
<rect x="133" y="322" width="374" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="340" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USW Flex 2.5G 8 PoE in its 1U keystone mount</text>
<rect x="133" y="352" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="370" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Brush plate  ·  DACs, power cords to the rear</text>
<rect x="133" y="382" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="400" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Hub shelf (1U): Hue · Lutron · HDHomeRun · ONT</text>
<rect x="133" y="412" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="430" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Brush plate  ·  cords down to the PDU</text>
<rect x="133" y="442" width="374" height="56" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="467" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Power Distribution Pro  ·  2U  ·  8.2 lb</text>
<text x="320" y="483" font-size="11" fill="#14532d" text-anchor="middle">replaces the Tripp Lite Isobar · fed from the UPS</text>
<rect x="133" y="502" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="520" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">1U open</text>
<rect x="133" y="532" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="550" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">1U open or blank plate (airflow above Big Boi)</text>
<rect x="133" y="562" width="374" height="176" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="320" y="647" font-size="13" font-weight="700" fill="#3b0764" text-anchor="middle">Big Boi · JMCD 12S4 · 6U</text>
<text x="320" y="663" font-size="11" fill="#3b0764" text-anchor="middle">36–38 lb with 4 HDDs · 48–50 lb with 12 · on rails/shelf</text>
<rect x="133" y="742" width="374" height="56" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="767" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Spare CLV shelf (U10) + 1U headroom</text>
<text x="320" y="783" font-size="11" fill="#334155" text-anchor="middle">for later</text>
<rect x="133" y="802" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="820" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">1U open</text>
<rect x="133" y="832" width="374" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="850" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">1U open (heat from the receiver)</text>
<rect x="133" y="862" width="374" height="146" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="932" font-size="13" font-weight="700" fill="#881337" text-anchor="middle">Future: Denon AV receiver on a deep shelf</text>
<text x="320" y="948" font-size="11" fill="#881337" text-anchor="middle">~4U receiver on a 1U shelf · basement AV</text>
<rect x="133" y="1012" width="374" height="56" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320" y="1037" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">UniFi UPS 2U  ·  30.9 lb</text>
<text x="320" y="1053" font-size="11" fill="#78350f" text-anchor="middle">on rear support rails · battery outlets: Big Boi + PDU</text>
<line x1="544" y1="121" x2="562" y2="100" stroke="#a16207" stroke-width="1.2"/><circle cx="544" cy="121" r="3" fill="#a16207"/>
<text x="570" y="100" font-size="13" font-weight="700" fill="#a16207">USB radios</text>
<text x="570" y="118" font-size="12" fill="#334155">ZWA-2 is too big for a shelf: top of the rack or</text>
<text x="570" y="134" font-size="12" fill="#334155">wall-mounted beside it. Both sticks hang off Big Boi</text>
<text x="570" y="150" font-size="12" fill="#334155">(U12–U17) on USB 2.0 extensions: Zigbee up to the hub</text>
<text x="570" y="166" font-size="12" fill="#334155">shelf, ZWA-2 up to the top. Re-map both in the HA VM.</text>
<line x1="544" y1="215" x2="562" y2="196" stroke="#2563eb" stroke-width="1.2"/><circle cx="544" cy="215" r="3" fill="#2563eb"/>
<text x="570" y="196" font-size="13" font-weight="700" fill="#2563eb">Panels sandwich the switch</text>
<text x="570" y="214" font-size="12" fill="#334155">Patch panel A directly above the Pro Max 16 and B</text>
<text x="570" y="230" font-size="12" fill="#334155">directly below: every port patches 1U with 6&quot; cables.</text>
<text x="570" y="246" font-size="12" fill="#334155">UDM Pro under B, so its LAN ports get 6&quot; runs too.</text>
<text x="570" y="262" font-size="12" fill="#334155">Aggregation under the UDM: SFP+ DACs to the UDM</text>
<text x="570" y="278" font-size="12" fill="#334155">(adjacent), the Pro Max (3U up) and Big Boi (1.5 m).</text>
<line x1="544" y1="395" x2="562" y2="300" stroke="#475569" stroke-width="1.2"/><circle cx="544" cy="395" r="3" fill="#475569"/>
<text x="570" y="300" font-size="13" font-weight="700" fill="#475569">Hub shelf, 1U only</text>
<text x="570" y="318" font-size="12" fill="#334155">Hue, Lutron, HDHomeRun, ONT and the Zigbee dongle.</text>
<text x="570" y="334" font-size="12" fill="#334155">No headroom: the brush plate sits right above, so</text>
<text x="570" y="350" font-size="12" fill="#334155">the tallest box must fit in about 40 mm (1.6&quot;). Check</text>
<text x="570" y="366" font-size="12" fill="#334155">the HDHomeRun and ONT. Ting ONT: here if it fits.</text>
<line x1="544" y1="470" x2="562" y2="388" stroke="#16a34a" stroke-width="1.2"/><circle cx="544" cy="470" r="3" fill="#16a34a"/>
<text x="570" y="388" font-size="13" font-weight="700" fill="#16a34a">Brush plate over the PDU Pro</text>
<text x="570" y="406" font-size="12" fill="#334155">Cords drop through the brush to the PDU (outlet side</text>
<text x="570" y="422" font-size="12" fill="#334155">unconfirmed). Fed from a UPS battery outlet; powers</text>
<text x="570" y="438" font-size="12" fill="#334155">everything except Big Boi and the receiver. Replaces</text>
<text x="570" y="454" font-size="12" fill="#334155">the Isobar. U18 open for airflow, U19 spare.</text>
<line x1="544" y1="650" x2="562" y2="474" stroke="#7c3aed" stroke-width="1.2"/><circle cx="544" cy="650" r="3" fill="#7c3aed"/>
<text x="570" y="474" font-size="13" font-weight="700" fill="#7c3aed">Big Boi up 2U (U12–U17)</text>
<text x="570" y="492" font-size="12" fill="#334155">Drive bays roughly 23–34&quot; off the floor, depending</text>
<text x="570" y="508" font-size="12" fill="#334155">on the base and casters. Support it from below</text>
<text x="570" y="524" font-size="12" fill="#334155">(L-rails or a rated 1U shelf); ears alone aren&#x27;t</text>
<text x="570" y="540" font-size="12" fill="#334155">meant to carry ~50 lb. Measure the 12S4 without</text>
<text x="570" y="556" font-size="12" fill="#334155">feet to confirm 6U.</text>
<line x1="544" y1="770" x2="562" y2="590" stroke="#475569" stroke-width="1.2"/><circle cx="544" cy="770" r="3" fill="#475569"/>
<text x="570" y="590" font-size="13" font-weight="700" fill="#475569">Spare shelf under Big Boi</text>
<text x="570" y="608" font-size="12" fill="#334155">CLV shelf at U10 with 1U above it, kept for later.</text>
<text x="570" y="624" font-size="12" fill="#334155">250 mm deep, 44 lb max: small boxes only.</text>
<line x1="544" y1="905" x2="562" y2="660" stroke="#e11d48" stroke-width="1.2"/><circle cx="544" cy="905" r="3" fill="#e11d48"/>
<text x="570" y="660" font-size="13" font-weight="700" fill="#e11d48">Future Denon receiver (U3–U7)</text>
<text x="570" y="678" font-size="12" fill="#334155">Heavy, so it goes low. Typical X-series AVRs are about</text>
<text x="570" y="694" font-size="12" fill="#334155">4U tall and ~390 mm deep: too deep for a CLV (250</text>
<text x="570" y="710" font-size="12" fill="#334155">mm), so use a deeper vented shelf, and check rear</text>
<text x="570" y="726" font-size="12" fill="#334155">room for speaker wire in the 18&quot; rack. Keep U8 open</text>
<text x="570" y="742" font-size="12" fill="#334155">for its heat. Power it from the wall, not the PDU:</text>
<text x="570" y="758" font-size="12" fill="#334155">it can draw hundreds of watts and would drain the</text>
<text x="570" y="774" font-size="12" fill="#334155">UPS. Size from the actual model before buying.</text>
<line x1="544" y1="1040" x2="562" y2="832" stroke="#d97706" stroke-width="1.2"/><circle cx="544" cy="1040" r="3" fill="#d97706"/>
<text x="570" y="832" font-size="13" font-weight="700" fill="#d97706">UPS at the very bottom</text>
<text x="570" y="850" font-size="12" fill="#334155">Densest item (14 kg in 2U). Only two battery</text>
<text x="570" y="866" font-size="12" fill="#334155">outlets used: Big Boi and the PDU Pro. Check</text>
<text x="570" y="882" font-size="12" fill="#334155">whether it shipped with rails; if not, add rear</text>
<text x="570" y="898" font-size="12" fill="#334155">supports.</text>
<rect x="30" y="1130" width="920" height="200" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="50" y="1156" font-size="14" font-weight="700" fill="#0f172a">Weight (estimates, 2026-11-12)</text>
<text x="440" y="1156" font-size="12" font-weight="700" fill="#475569">4 HDDs</text><text x="560" y="1156" font-size="12" font-weight="700" fill="#475569">12 HDDs</text>
<text x="50" y="1178" font-size="12" font-weight="400" fill="#0f172a">UPS 2U (U1–U2)</text>
<text x="440" y="1178" font-size="12" font-weight="400" fill="#0f172a">30.9 lb</text>
<text x="560" y="1178" font-size="12" font-weight="400" fill="#0f172a">30.9 lb</text>
<text x="50" y="1196" font-size="12" font-weight="400" fill="#0f172a">Big Boi in 12S4 (U12–U17)</text>
<text x="440" y="1196" font-size="12" font-weight="400" fill="#0f172a">36–38 lb</text>
<text x="560" y="1196" font-size="12" font-weight="400" fill="#0f172a">48–50 lb</text>
<text x="50" y="1214" font-size="12" font-weight="400" fill="#0f172a">Pro Max 16 + UDM Pro + Aggregation (U26–U29)</text>
<text x="440" y="1214" font-size="12" font-weight="400" fill="#0f172a">~19.6 lb</text>
<text x="560" y="1214" font-size="12" font-weight="400" fill="#0f172a">~19.6 lb</text>
<text x="50" y="1232" font-size="12" font-weight="400" fill="#0f172a">PDU Pro 8.2 · 2 CLV shelves 11.0 · 2 brush plates 1.9</text>
<text x="440" y="1232" font-size="12" font-weight="400" fill="#0f172a">~21 lb</text>
<text x="560" y="1232" font-size="12" font-weight="400" fill="#0f172a">~21 lb</text>
<text x="50" y="1250" font-size="12" font-weight="400" fill="#0f172a">Patch panels, Flex mount, small boxes, cables (guess)</text>
<text x="440" y="1250" font-size="12" font-weight="400" fill="#0f172a">6–13 lb</text>
<text x="560" y="1250" font-size="12" font-weight="400" fill="#0f172a">6–13 lb</text>
<text x="50" y="1268" font-size="12" font-weight="400" fill="#0f172a">Future Denon AVR + deep shelf (guess, by model)</text>
<text x="440" y="1268" font-size="12" font-weight="400" fill="#0f172a">~25–40 lb</text>
<text x="560" y="1268" font-size="12" font-weight="400" fill="#0f172a">~25–40 lb</text>
<text x="50" y="1286" font-size="12" font-weight="700" fill="#0f172a">Total</text>
<text x="440" y="1286" font-size="12" font-weight="700" fill="#0f172a">~139–163 lb</text>
<text x="560" y="1286" font-size="12" font-weight="700" fill="#0f172a">~151–175 lb</text>
<text x="690" y="1178" font-size="12" fill="#334155">UPS and receiver low, Big Boi</text>
<text x="690" y="1194" font-size="12" fill="#334155">mid-rack. Under a third of the</text>
<text x="690" y="1210" font-size="12" fill="#334155">500 lb rating. Lock the casters;</text>
<text x="690" y="1226" font-size="12" fill="#334155">pull the drives before rolling it.</text>
<text x="690" y="1242" font-size="12" fill="#334155">Agg, PDU, shelf, brush weights</text>
<text x="690" y="1258" font-size="12" fill="#334155">from UI specs; the rest guessed.</text>
</svg>
